<!-- templates/chat/chat_room.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Room</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for chat messages */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="chat-app" class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Chat Room</h1>
        <div class="bg-white shadow-lg rounded-lg p-6 max-w-4xl mx-auto">
            
            <!-- Chat Messages Area -->
            <div class="chat-messages h-96 overflow-y-auto mb-4 p-4 border rounded-md bg-gray-50" style="max-height: 400px;">
                <div v-for="message in messages" :key="message.id" class="mb-3 p-3 rounded-lg" 
                     :class="{'ml-auto bg-blue-500 text-white': message.username === currentUser, 'bg-gray-200 text-gray-800': message.username !== currentUser}">
                    <p class="font-semibold text-sm" :class="{'text-blue-100': message.username === currentUser, 'text-gray-600': message.username !== currentUser}">
                        {{ message.username }}
                        <span class="text-xs ml-2">[{{ message.timestamp }}]</span>
                    </p>
                    <p class="mt-1 text-base">{{ message.content }}</p>
                </div>
                <div v-if="messages.length === 0" class="text-center text-gray-500">No messages yet.</div>
            </div>

            <!-- Message Input Area -->
            <form @submit.prevent="sendMessage" class="flex items-center space-x-4">
                <input type="text" v-model="newMessageText" placeholder="Type your message..." 
                       class="flex-grow px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required>
                <button type="submit" 
                        class="bg-blue-600 text-white py-3 px-6 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                    Send
                </button>
            </form>
            
            <div class="text-right mt-3 text-sm text-gray-500">
                Logged in as: <span class="font-medium">{{ currentUser }}</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Set CSRF token for Axios
        axios.defaults.headers.common['X-CSRFToken'] = '{{ csrf_token }}';

        new Vue({
            el: '#chat-app',
            delimiters: ['${', '{{'], // Cambia los delimitadores para evitar conflictos con Django
            data: {
                messages: [],
                newMessageText: '',
                currentUser: '{{ request.session.username }}', // Obtiene el username de la sesión de Django
                pollingInterval: null // Para almacenar el intervalo de polling
            },
            created() {
                // Cargar mensajes iniciales y empezar polling
                this.fetchMessages();
                this.startPolling();
            },
            methods: {
                fetchMessages() {
                    axios.get("{% url 'chat:get_messages' %}")
                        .then(response => {
                            this.messages = response.data;
                            // Auto-scroll to bottom
                            this.$nextTick(() => {
                                const chatMessages = this.$el.querySelector('.chat-messages');
                                if (chatMessages) {
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            });
                        })
                        .catch(error => {
                            console.error("Error fetching messages:", error);
                        });
                },
                sendMessage() {
                    if (this.newMessageText.trim() === '') return; // No enviar mensajes vacíos

                    axios.post("{% url 'chat:send_message' %}", {
                        content: this.newMessageText
                    })
                    .then(response => {
                        this.newMessageText = ''; // Limpiar el input
                        this.fetchMessages(); // Refrescar mensajes después de enviar
                    })
                    .catch(error => {
                        console.error("Error sending message:", error);
                        // Aquí podrías mostrar un mensaje de error al usuario
                    });
                },
                startPolling() {
                    // Polling cada 3 segundos (180000 ms)
                    this.pollingInterval = setInterval(this.fetchMessages, 3000); 
                },
                stopPolling() {
                    clearInterval(this.pollingInterval);
                }
            },
            beforeDestroy() {
                // Limpiar el intervalo de polling al destruir la instancia de Vue
                this.stopPolling();
            }
        });
    </script>
</body>
</html>
